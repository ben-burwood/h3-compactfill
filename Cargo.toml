[package]
name = "h3-compactfill"
version = "0.2.2"
edition = "2024"
description = "H3 compacted polyfill"
authors = ["Ben Burwood <ben.burwood@outlook.com>"]
readme = "README.md"
repository = "https://github.com/ben-burwood/h3-compactfill"
license-file = "LICENCE"

[dependencies]
geo = "0.33"
rstar = "0.12"
h3o = { version = "0.11.0", features = ["geo"] }

[dev-dependencies]
peak_alloc = "0.3"

[[bench]]
name = "fill"
harness = false

[profile.release]
lto = true
